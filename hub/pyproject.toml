[project]
name = "gpu-hub"
version = "0.1.0"
description = "Central hub that collects GPU snapshots from node agents and serves the live dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_hub"]
